<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bevy Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }

        #container {
            text-align: center;
        }

        canvas {
            display: block;
            margin: 20px auto;
            background: #000;
            border: 2px solid #333;
            border-radius: 4px;
        }

        #loading {
            font-size: 18px;
            color: #888;
        }

        .controls {
            margin-top: 20px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 8px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .controls h2 {
            margin-top: 0;
            color: #ff6b35;
        }

        .controls p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
<div id="container">
    <h1>🦀 Bevy Game</h1>
    <div id="loading">Chargement du jeu...</div>
    <canvas id="bevy"></canvas>

    <div class="controls">
        <h2>Contrôles</h2>
        <p>⌨️ ZQSD ou ⬆️⬇️⬅️➡️ : Déplacer</p>
        <p>Le carré tourne automatiquement</p>
    </div>
</div>

<script type="module">
    import init from './bevy_game.js';

    async function run() {
        try {
            // Initialiser le module WASM
            await init();

            // Cacher le message de chargement
            document.getElementById('loading').style.display = 'none';
        } catch (error) {
            console.error('Erreur de chargement:', error);
            document.getElementById('loading').textContent =
                'Erreur de chargement. Vérifie la console pour plus de détails.';
        }
    }

    run();
</script>
</body>
</html>
