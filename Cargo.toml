[package]
name = "bevy_game"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.15"

# Optimisations pour la compilation en développement
[profile.dev]
opt-level = 1

# Optimisations pour le build release
[profile.release]
opt-level = 3
lto = "thin"

# Config spécifique pour WASM
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1

# Fix pour WASM - utiliser getrandom 0.3 avec la feature wasm_js
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }