<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bevy Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        /* Loader invisible mais qui empêche les clics pendant le chargement */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            pointer-events: all;
            opacity: 1;
            transition: opacity 0.3s ease-out;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div id="loading"></div>
<canvas id="bevy"></canvas>

<script type="module">
    import init from './bevy_game.js';

    async function run() {
        try {
            await init();

            // Petit délai pour s'assurer que le rendu est prêt
            requestAnimationFrame(() => {
                document.getElementById('loading').classList.add('hidden');
            });
        } catch (error) {
            console.error('Erreur de chargement:', error);
        }
    }

    run();
</script>
</body>
</html>
