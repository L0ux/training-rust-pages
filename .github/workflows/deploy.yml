name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Empêcher les déploiements concurrents
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  EM_VERSION: 4.0.11  # version utilisée par la CI officielle de Godot 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot + web export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          tpl_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p ~/godot "$tpl_dir"

          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

          # On n'extrait que les templates web (l'archive complète fait ~1 Go)
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j /tmp/templates.tpz 'templates/web_*' 'templates/version.txt' -d "$tpl_dir"
          ls -la "$tpl_dir"

      # --- Template web allégé (sans 3D, modules inutiles retirés) ---
      # Compilé une seule fois puis mis en cache tant que la version de Godot
      # et build_profile/web_template.py ne changent pas.
      - name: Cache custom web template
        id: cache-template
        uses: actions/cache@v4
        with:
          path: ~/custom-template
          key: web-template-${{ env.GODOT_VERSION }}-em${{ env.EM_VERSION }}-${{ hashFiles('build_profile/web_template.py') }}

      - name: Checkout Godot source
        if: steps.cache-template.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_VERSION }}-stable
          path: godot-src

      - name: Set up Python
        if: steps.cache-template.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Emscripten
        if: steps.cache-template.outputs.cache-hit != 'true'
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EM_VERSION }}

      - name: Build custom web template
        if: steps.cache-template.outputs.cache-hit != 'true'
        run: |
          pip install scons
          cd godot-src
          scons profile="$GITHUB_WORKSPACE/build_profile/web_template.py" -j$(nproc)
          mkdir -p ~/custom-template
          cp bin/godot.web.template_release.wasm32*.zip ~/custom-template/web_nothreads_release.zip
          ls -la bin ~/custom-template
          # Sinon l'export Godot scannerait toutes les sources du moteur
          cd .. && rm -rf godot-src

      - name: Use custom web template
        run: |
          cp ~/custom-template/web_nothreads_release.zip \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/web_nothreads_release.zip"

      - name: Export Web
        run: |
          ~/godot/godot --headless --import
          mkdir -p build
          ~/godot/godot --headless --export-release "Web" build/index.html
          cp CNAME build/
          ls -la build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
